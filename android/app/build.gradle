plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lingxi.music'
    compileSdk 34

    defaultConfig {
        applicationId "com.lingxi.music"
        minSdk 21
        targetSdk 34
        versionCode 23
        versionName "1.9.2"
    }

    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
}
