name: Build Android APK
on:
  push:
    branches: [ main, 'feature/**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Frontend Bundle
        run: python3 scripts/build.py --check

      - name: Read Release Version
        id: ver
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          v = json.load(open('version.json', encoding='utf-8'))
          print('name=' + v['versionName'])
          print('changelog<<EOF')
          print(v.get('changelog', ''))
          print('EOF')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Configure Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build APK with Gradle
        run: |
          cd android
          gradle assembleRelease --stacktrace

      - name: Prepare APK Outputs
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/release/app-release.apk output/LingXiMusic.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LingXiMusic
          path: output/LingXiMusic.apk

      - name: Create or Update Production Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: "灵犀音乐 Android 正式版 v${{ steps.ver.outputs.name }}"
          body: ${{ steps.ver.outputs.changelog }}
          files: |
            output/LingXiMusic.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or Update Test Release
        uses: softprops/action-gh-release@v2
        if: github.ref != 'refs/heads/main'
        with:
          tag_name: test-apk
          name: "灵犀音乐 内部测试版"
          body: "灵犀音乐内部测试包，仅供本地验证使用。"
          prerelease: true
          files: |
            output/LingXiMusic.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
